<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Task Manager</title>
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>✅ Meri Kaam List</h1>
            <p>Apne din ko organize karein</p>
        </header>

        <!-- Input Section -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Kya karna hai? (e.g., Grocery khareedna)">
            <button id="addBtn">Add Karein</button>
        </div>

        <!-- Task List -->
        <ul id="taskList">
            <!-- Tasks yahan JavaScript se aayenge -->
        </ul>
        
        <div class="empty-state" id="emptyState">
            <p>Koi task nahi hai. Abhi shuru karein!</p>
        </div>
    </div>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
